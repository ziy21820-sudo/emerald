<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的谷子</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4fa;color:#39343d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:28px 24px 80px}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.logo{font-size:30px;font-weight:700;color:#66558f}
.subtitle{margin-top:5px;color:#9a939f;font-size:14px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.add-btn,.tool-btn{border:0;border-radius:14px;padding:11px 15px}
.add-btn{color:white;background:#7564a8;box-shadow:0 6px 18px rgba(117,100,168,.2)}
.tool-btn{background:#eeeaf4;color:#685e78}
.tool-btn:hover{background:#e4dff0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:26px}
.stat-card{background:#fff;padding:20px;border-radius:20px;box-shadow:0 5px 20px rgba(80,65,100,.05)}
.stat-label{color:#99929e;font-size:13px}
.stat-value{margin-top:8px;font-size:28px;font-weight:700;color:#4a4254}
.toolbar{display:flex;gap:12px;margin-bottom:20px}
.search{flex:1;border:0;background:#fff;padding:14px 18px;border-radius:15px;outline:none;box-shadow:0 4px 15px rgba(80,65,100,.04)}
.filter{border:0;background:#fff;padding:0 16px;border-radius:15px;color:#6f6874}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.category{border:0;background:#eeeaf4;color:#746984;padding:8px 15px;border-radius:999px}
.category.active{background:#7564a8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.item{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 5px 20px rgba(80,65,100,.05);transition:.2s}
.item:hover{transform:translateY(-3px)}
.item-img,.no-img{width:100%;aspect-ratio:1/1}
.item-img{object-fit:cover;background:#eeeaf3}
.no-img{display:flex;align-items:center;justify-content:center;color:#aaa2b1;background:#eeeaf3}
.item-info{padding:14px}
.item-name{font-weight:700;margin-bottom:7px}
.item-meta{font-size:12px;color:#99929e;line-height:1.7}
.tag{display:inline-block;margin-top:8px;padding:4px 9px;border-radius:999px;background:#f0ecf7;color:#7564a8;font-size:11px}
.modal,.bulk-modal{display:none;position:fixed;inset:0;background:rgba(40,35,45,.42);align-items:center;justify-content:center;padding:14px;z-index:30}
.modal.show,.bulk-modal.show{display:flex}
.modal-box{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:25px;padding:28px}
.bulk-box{width:min(1250px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:22px}
.modal-title,.bulk-title{font-weight:700}
.modal-title{font-size:23px;margin-bottom:22px}
.bulk-title{font-size:22px;margin-bottom:8px}
.bulk-help{font-size:12px;color:#8b8491;line-height:1.7;margin-bottom:12px}
.bulk-note{background:#f3eef9;color:#695d7a;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-item{display:flex;flex-direction:column;gap:7px}
.form-item.full{grid-column:1/-1}
.form-item label{font-size:13px;color:#77707d}
.form-item input,.form-item select,.form-item textarea{border:1px solid #e5e0e8;border-radius:12px;padding:11px;outline:none}
.form-item textarea{min-height:90px;resize:vertical}
.image-preview{width:130px;height:130px;object-fit:cover;border-radius:15px;margin-top:10px;display:none}
.modal-actions,.bulk-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.save,.cancel,.delete,.bulk-primary,.bulk-secondary{border:0;padding:12px 16px;border-radius:13px}
.save,.bulk-primary{background:#7564a8;color:#fff}
.save{flex:1}
.cancel,.bulk-secondary{background:#eeeaf3;color:#685e78}
.delete{background:#f7e7eb;color:#a55368}
.bulk-table-wrap{overflow:auto;border:1px solid #e5dfe9;border-radius:12px}
.bulk-table{width:100%;border-collapse:collapse;min-width:1120px}
.bulk-table th,.bulk-table td{border-bottom:1px solid #eee9f0;padding:6px}
.bulk-table th{background:#faf8fc;color:#77707d;font-size:12px;white-space:nowrap}
.bulk-table input,.bulk-table select{width:100%;min-width:75px;padding:8px;border:1px solid #e5e0e8;border-radius:8px;background:#fff}
.paste-area{display:none;width:100%;min-height:150px;margin-top:12px;border:1px solid #e5e0e8;border-radius:12px;padding:10px}
.footer{text-align:center;padding:40px 0 10px;font-size:13px;color:#b4adb9;letter-spacing:.3px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.form-item.full{grid-column:auto}}
@media(max-width:650px){.header{align-items:flex-start}.header-actions{justify-content:flex-start}.tool-btn,.add-btn{padding:9px 10px}}
@media(max-width:500px){.app{padding:20px 15px 70px}.logo{font-size:25px}.toolbar{flex-direction:column}.filter{padding:12px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div>
    <div class="logo">我的谷子 ✦</div>
    <div class="subtitle">把喜欢的收藏整理成自己的图鉴</div>
  </div>
  <div class="header-actions">
    <button class="tool-btn" onclick="openBulkModal()">▦ 批量添加</button>
    <button class="tool-btn" onclick="exportGoodsBackup()">↓ 导出备份</button>
    <button class="tool-btn" onclick="document.getElementById('importBackup').click()">↑ 导入备份</button>
    <input id="importBackup" type="file" accept=".json,application/json" style="display:none" onchange="importGoodsBackup(event)">
    <button class="add-btn" onclick="openModal()">＋ 添加谷子</button>
  </div>
</header>

<section class="stats">
  <div class="stat-card"><div class="stat-label">收藏数量</div><div class="stat-value" id="count">0</div></div>
  <div class="stat-card"><div class="stat-label">收藏款数</div><div class="stat-value" id="pieces">0</div></div>
  <div class="stat-card"><div class="stat-label">累计投入</div><div class="stat-value">¥<span id="total">0</span></div></div>
  <div class="stat-card"><div class="stat-label">未拥有 / 其他</div><div class="stat-value" id="wanted">0</div></div>
</section>

<section class="toolbar">
  <input id="search" class="search" placeholder="搜索谷子、角色、作品、系列……" oninput="render()">
  <select id="statusFilter" class="filter" onchange="render()">
    <option value="all">全部状态</option>
    <option value="已拥有">已拥有</option>
  </select>
</section>

<section class="categories">
  <button class="category active" onclick="setType('all',this)">全部</button>
  <button class="category" onclick="setType('吧唧',this)">吧唧</button>
  <button class="category" onclick="setType('亚克力',this)">亚克力</button>
  <button class="category" onclick="setType('立牌',this)">立牌</button>
  <button class="category" onclick="setType('卡片',this)">卡片</button>
  <button class="category" onclick="setType('色纸',this)">色纸</button>
  <button class="category" onclick="setType('毛绒',this)">毛绒</button>
  <button class="category" onclick="setType('挂件',this)">挂件</button>
  <button class="category" onclick="setType('其他',this)">其他</button>
</section>
<main id="grid" class="grid"></main>
<div class="footer">我超甜检测 2026</div>
</div>

<div id="modal" class="modal">
<div class="modal-box">
  <div class="modal-title" id="modalTitle">添加谷子</div>
  <div class="form-grid">
    <div class="form-item full"><label>图片</label><input type="file" accept="image/*" onchange="previewImage(event)"><img id="preview" class="image-preview"></div>
    <div class="form-item full"><label>谷子名称</label><input id="name" placeholder="例如：叶瑄58mm吧唧"></div>
    <div class="form-item"><label>作品 / IP</label><input id="work" placeholder="时空中的绘旅人"></div>
    <div class="form-item"><label>角色</label><input id="character" placeholder="叶瑄"></div>
    <div class="form-item"><label>类型</label><input id="type" placeholder="吧唧" list="typeList"><datalist id="typeList"></datalist></div>
    <div class="form-item"><label>系列</label><input id="series" placeholder="例如：白色情人节"></div>
    <div class="form-item"><label>尺寸</label><input id="size" placeholder="例如：58mm"></div>
    <div class="form-item"><label>数量</label><input id="quantity" type="number" min="1" value="1"></div>
    <div class="form-item"><label>单价（元）</label><input id="price" type="number" min="0" step="0.01"></div>
    <div class="form-item"><label>购买日期</label><input id="date" type="date"></div>
    <div class="form-item"><label>购买渠道</label><input id="shop" placeholder="谷店 / 闲鱼 / 官方"></div>
    <div class="form-item"><label>状态</label><input id="status" placeholder="已拥有" list="statusList"><datalist id="statusList"></datalist></div>
    <div class="form-item full"><label>备注</label><textarea id="memo" placeholder="版本、特典、瑕疵、来源等……"></textarea></div>
  </div>
  <div class="modal-actions">
    <button class="cancel" onclick="closeModal()">取消</button>
    <button id="deleteBtn" class="delete" style="display:none" onclick="deleteItem()">删除</button>
    <button class="save" onclick="saveItem()">保存</button>
  </div>
</div>
</div>

<div id="bulkModal" class="bulk-modal">
<div class="bulk-box">
  <div class="bulk-title">批量添加谷子</div>
  <div class="bulk-help">每一行代表一款谷子。可以直接填写，也可以把 Excel / WPS / Google 表格中的多行内容复制后粘贴。图片不能通过表格批量导入，保存后可以再点开单件谷子补图片。</div>
  <div class="bulk-note">列顺序：谷子名称｜作品/IP｜角色｜类型｜系列｜尺寸｜数量｜单价（元）｜购买日期｜购买渠道｜状态｜备注</div>
  <div id="bulkTableWrap" class="bulk-table-wrap"></div>
  <textarea id="bulkPasteArea" class="paste-area" placeholder="把 Excel / WPS 中复制的表格直接粘贴到这里……"></textarea>
  <div class="bulk-actions">
    <button class="bulk-secondary" onclick="addBulkRow()">＋ 添加一行</button>
    <button class="bulk-secondary" onclick="addBulkRows(10)">＋ 添加10行</button>
    <button class="bulk-secondary" onclick="togglePasteArea()">📋 粘贴表格</button>
    <button class="bulk-secondary" onclick="downloadCSVTemplate()">↓ CSV模板</button>
    <button class="bulk-secondary" onclick="document.getElementById('bulkCSV').click()">↑ 导入CSV</button>
    <input id="bulkCSV" type="file" accept=".csv,.txt" style="display:none" onchange="importBulkCSV(event)">
    <button class="bulk-primary" onclick="saveBulkItems()">保存全部</button>
    <button class="bulk-secondary" onclick="closeBulkModal()">取消</button>
  </div>
</div>
</div>

<script>
let items=JSON.parse(localStorage.getItem("goodsCollection")||"[]");
let currentType="all",editingId=null,currentImage="";
const BULK_COLS=["name","work","character","type","series","size","quantity","price","date","shop","status","memo"];
const BULK_LABELS=["谷子名称","作品/IP","角色","类型","系列","尺寸","数量","单价（元）","购买日期","购买渠道","状态","备注"];

function saveData(){localStorage.setItem("goodsCollection",JSON.stringify(items));}
function openModal(id=null){
  editingId=id; currentImage="";
  document.getElementById("modal").classList.add("show");
  document.getElementById("modalTitle").textContent=id?"编辑谷子":"添加谷子";
  document.getElementById("deleteBtn").style.display=id?"block":"none";
  if(id){
    const item=items.find(x=>x.id===id); if(!item)return;
    ["name","work","character","series","size","quantity","price","date","shop","memo"].forEach(k=>document.getElementById(k).value=item[k]??"");
    document.getElementById("type").value=item.type||"";
    document.getElementById("status").value=item.status||"";
    currentImage=item.image||"";
    const p=document.getElementById("preview");
    if(currentImage){p.src=currentImage;p.style.display="block"}else p.style.display="none";
  }else clearForm();
}
function clearForm(){
  document.querySelectorAll("#modal input,#modal textarea").forEach(el=>{if(el.type!=="file")el.value=""});
  document.getElementById("quantity").value=1;
  document.getElementById("type").value="";
  document.getElementById("status").value="";
  document.getElementById("preview").style.display="none";
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function previewImage(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();r.onload=ev=>{currentImage=ev.target.result;const p=document.getElementById("preview");p.src=currentImage;p.style.display="block"};r.readAsDataURL(file);
}
function saveItem(){
  const name=document.getElementById("name").value.trim();if(!name){alert("请填写谷子名称");return}
  const item={id:editingId||Date.now()+Math.random(),name,work:document.getElementById("work").value.trim(),character:document.getElementById("character").value.trim(),type:document.getElementById("type").value.trim()||"其他",series:document.getElementById("series").value.trim(),size:document.getElementById("size").value.trim(),quantity:Number(document.getElementById("quantity").value)||1,price:Number(document.getElementById("price").value)||0,date:document.getElementById("date").value,shop:document.getElementById("shop").value.trim(),status:document.getElementById("status").value.trim()||"已拥有",memo:document.getElementById("memo").value.trim(),image:currentImage};
  if(editingId){const i=items.findIndex(x=>x.id===editingId);if(i>=0)items[i]=item}else items.unshift(item);
  saveData();closeModal();render();
}
function deleteItem(){if(!editingId)return;if(!confirm("确定删除这件谷子吗？"))return;items=items.filter(x=>x.id!==editingId);saveData();closeModal();render()}
function setType(type,btn){currentType=type;document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()}
function render(){
  const keyword=(document.getElementById("search").value||"").toLowerCase();
  const status=document.getElementById("statusFilter").value;
  const list=items.filter(item=>{
    const text=[item.name,item.work,item.character,item.series,item.type,item.size,item.shop,item.memo].join(" ").toLowerCase();
    return text.includes(keyword)&&(currentType==="all"||item.type===currentType)&&(status==="all"||item.status===status);
  });
  const grid=document.getElementById("grid");
  grid.innerHTML=list.length?list.map(createCard).join(""):`<div style="grid-column:1/-1;background:white;border-radius:20px;padding:70px 20px;text-align:center;color:#9b949f"><div style="font-size:45px">✦</div><div style="margin-top:12px">暂时没有找到谷子</div></div>`;
  updateStats();
  updateDatalists();
}
function createCard(item){
  const image=item.image?`<img class="item-img" src="${escapeAttr(item.image)}" alt="">`:`<div class="no-img">暂无图片</div>`;
  const price=item.price?` · ¥${(Number(item.price)*Number(item.quantity||1)).toFixed(2)}`:"";
  return `<article class="item" onclick="openModal(${JSON.stringify(item.id)})">${image}<div class="item-info"><div class="item-name">${escapeHtml(item.name)}</div><div class="item-meta">${escapeHtml(item.work||"")}${item.character?" · "+escapeHtml(item.character):""}<br>${item.series?escapeHtml(item.series)+" · ":""}${escapeHtml(item.size||"")}<br>×${Number(item.quantity||1)}${price}</div><span class="tag">${escapeHtml(item.status||"已拥有")}</span></div></article>`;
}
function escapeHtml(t){return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeAttr(t){return escapeHtml(t)}
function updateStats(){
  let pieces=0,total=0,notOwned=0;
  items.forEach(i=>{const q=Number(i.quantity)||1,p=Number(i.price)||0;pieces+=q;total+=q*p;if(i.status!=="已拥有")notOwned++});
  document.getElementById("count").textContent=items.length;
  document.getElementById("pieces").textContent=pieces;
  document.getElementById("total").textContent=total.toFixed(2);
  document.getElementById("wanted").textContent=notOwned;
}
function updateDatalists(){
  const types=new Set();const statuses=new Set();
  items.forEach(i=>{if(i.type)types.add(i.type);if(i.status)statuses.add(i.status)});
  const typeList=document.getElementById("typeList");typeList.innerHTML="";types.forEach(t=>{const o=document.createElement("option");o.value=t;typeList.appendChild(o)});
  const statusList=document.getElementById("statusList");statusList.innerHTML="";statuses.forEach(s=>{const o=document.createElement("option");o.value=s;statusList.appendChild(o)});
}

/* ===== 备份 ===== */
function exportGoodsBackup(){
  const data={app:"我的谷子",version:2,exportedAt:new Date().toISOString(),items};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  downloadBlob(blob,"我的谷子_备份_"+dateStamp()+".json");
}
function importGoodsBackup(e){
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const incoming=Array.isArray(obj)?obj:obj.items;
      if(!Array.isArray(incoming))throw new Error("格式不正确");
      if(!confirm("导入备份会覆盖当前谷子数据，确定继续吗？"))return;
      items=incoming.map(normalizeItem);saveData();render();alert("导入成功，共 "+items.length+" 款谷子。");
    }catch(err){alert("导入失败：备份文件格式不正确。")}
  };
  r.readAsText(file,"utf-8");
}
function normalizeItem(i){return {id:i.id??Date.now()+Math.random(),name:String(i.name??""),work:String(i.work??""),character:String(i.character??""),type:String(i.type??""),series:String(i.series??""),size:String(i.size??""),quantity:Number(i.quantity)||1,price:Number(i.price)||0,date:String(i.date??""),shop:String(i.shop??""),status:String(i.status??""),memo:String(i.memo??""),image:String(i.image??"")}}
function dateStamp(){return new Date().toISOString().slice(0,10)}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

/* ===== 批量添加 ===== */
let bulkRows=[];
function blankBulkRow(){return {name:"",work:"",character:"",type:"",series:"",size:"",quantity:1,price:"",date:"",shop:"",status:"",memo:""}}
function openBulkModal(){
  document.getElementById("bulkModal").classList.add("show");
  document.getElementById("bulkPasteArea").style.display="none";
  bulkRows=[blankBulkRow()];
  renderBulkTable();
}
function closeBulkModal(){document.getElementById("bulkModal").classList.remove("show")}
function addBulkRow(){bulkRows.push(blankBulkRow());renderBulkTable();setTimeout(scrollBulkBottom,50)}
function addBulkRows(n){for(let i=0;i<n;i++)bulkRows.push(blankBulkRow());renderBulkTable();setTimeout(scrollBulkBottom,50)}
function scrollBulkBottom(){const el=document.getElementById("bulkTableWrap");el.scrollTop=el.scrollHeight}
function renderBulkTable(){
  const wrap=document.getElementById("bulkTableWrap");
  let h="<table class='bulk-table'><thead><tr><th>#</th>";
  BULK_LABELS.forEach(x=>h+="<th>"+x+"</th>");
  h+="<th>操作</th></tr></thead><tbody>";
  bulkRows.forEach((row,ri)=>{
    h+="<tr><td>"+(ri+1)+"</td>";
    BULK_COLS.forEach((key,ci)=>{
      if(key==="quantity")h+="<td><input type='number' min='1' value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"].quantity=this.value'></td>";
      else if(key==="price")h+="<td><input type='number' min='0' step='0.01' value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"].price=this.value'></td>";
      else if(key==="date")h+="<td><input type='date' value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"].date=this.value'></td>";
      else h+="<td><input value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"]."+key+"=this.value'></td>";
    });
    h+="<td><button class='bulk-secondary' onclick='removeBulkRow("+ri+")'>删除</button></td></tr>";
  });
  h+="</tbody></table>";
  wrap.innerHTML=h;
}
function removeBulkRow(i){bulkRows.splice(i,1);if(!bulkRows.length)bulkRows=[blankBulkRow()];renderBulkTable()}
function togglePasteArea(){
  const a=document.getElementById("bulkPasteArea");
  a.style.display=a.style.display==="block"?"none":"block";
  if(a.style.display==="block")a.focus();
}
function parseTSV(text){
  return text.trim().split(/\r?\n/).map(line=>line.split("\t"));
}
function applyPastedTable(){
  const text=document.getElementById("bulkPasteArea").value.trim();
  if(!text)return;
  const rows=parseTSV(text);
  const first=rows[0].map(x=>x.trim());
  const hasHeader=first.some(x=>x==="谷子名称"||x==="作品/IP"||x==="角色");
  const data=hasHeader?rows.slice(1):rows;
  bulkRows=data.filter(r=>r.some(x=>x.trim()!=="")).map(r=>rowFromArray(r));
  if(!bulkRows.length)bulkRows=[blankBulkRow()];
  renderBulkTable();
  document.getElementById("bulkPasteArea").style.display="none";
}
document.addEventListener("paste",e=>{
  const a=document.getElementById("bulkPasteArea");
  if(document.getElementById("bulkModal").classList.contains("show")&&document.activeElement===a){
    setTimeout(applyPastedTable,0);
  }
});
function rowFromArray(a){
  const r=blankBulkRow();
  BULK_COLS.forEach((k,i)=>{if(a[i]!==undefined)r[k]=a[i].trim()});
  r.quantity=Number(r.quantity)||1;r.price=Number(r.price)||0;
  return r;
}
function downloadCSVTemplate(){
  const header=BULK_LABELS.join(",");
  const example="叶瑄58mm吧唧,时空中的绘旅人,叶瑄,吧唧,白色情人节,58mm,1,15,2026-08-20,闲鱼,已拥有,示例";
  downloadBlob(new Blob(["\uFEFF"+header+"\n"+example+"\n"],{type:"text/csv;charset=utf-8"}),"我的谷子_批量模板.csv");
}
function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}
    if(c==='"'){quoted=!quoted;continue}
    if(c===","&&!quoted){row.push(cell);cell="";continue}
    if((c==="\n"||c==="\r")&&!quoted){
      if(c==="\r"&&n==="\n")i++;
      row.push(cell);cell="";
      if(row.some(x=>x!==""))rows.push(row);
      row=[];continue;
    }
    cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(x=>x!==""))rows.push(row)}
  return rows;
}
function importBulkCSV(e){
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    const rows=parseCSV(String(r.result).replace(/^\uFEFF/,""));
    if(!rows.length){alert("CSV里没有数据");return}
    const first=rows[0].map(x=>x.trim());
    const data=first.includes("谷子名称")?rows.slice(1):rows;
    bulkRows=data.filter(x=>x.some(v=>v.trim()!=="")).map(rowFromArray);
    if(!bulkRows.length)bulkRows=[blankBulkRow()];
    renderBulkTable();
  };
  r.readAsText(file,"utf-8");
}
function saveBulkItems(){
  const paste=document.getElementById("bulkPasteArea");
  if(paste.value.trim())applyPastedTable();
  const valid=bulkRows.filter(r=>String(r.name||"").trim());
  if(!valid.length){alert("请至少填写一行谷子名称");return}
  const now=Date.now();
  valid.forEach((r,i)=>items.unshift(normalizeItem({...r,id:now+i+Math.random()})));
  saveData();closeBulkModal();render();alert("已成功添加 "+valid.length+" 款谷子。");
}

document.getElementById("modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById("bulkModal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeBulkModal()});
render();
</script>
